<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Greeting Card – Raksha Bandhan</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/animation.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a2e0b5ea47.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Header Include -->
  <div id="header"></div>

  <!-- Hero Section -->
  <header class="text-white text-center py-4 shadow custom-header">
    <h1 class="display-5">🪢 Create Your Raksha Bandhan Greeting Card</h1>
    <p class="lead">Celebrate the bond with love and creativity 💖</p>
  </header>

  <!-- Main Container -->
  <div class="container py-5">
    <div class="row g-5">

      <!-- Form Section -->
      <div class="col-md-6">
        <form id="card-form" class="card-style p-4 shadow rounded-4 border-0 bg-light">
          <div class="mb-3">
            <label for="to" class="form-label">To</label>
            <input type="text" class="form-control" id="to" placeholder="Brother/Sister's Name" required />
          </div>

          <div class="mb-3">
            <label for="to-gender" class="form-label">To Gender</label>
            <select class="form-select" id="to-gender" required>
              <option value="female">👧 Girl</option>
              <option value="male">🙋‍♂️ Boy</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="from" class="form-label">From</label>
            <input type="text" class="form-control" id="from" placeholder="Your Name" required />
          </div>

          <div class="mb-3">
            <label for="from-gender" class="form-label">From Gender</label>
            <select class="form-select" id="from-gender" required>
              <option value="male">🙋‍♂️ Boy</option>
              <option value="female">👧 Girl</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Write your heartfelt Rakhi message..." required></textarea>
          </div>

          <div class="mb-3">
            <label for="style" class="form-label">Card Style</label>
            <select class="form-select" id="style" required>
              <option value="classic">🎀 Classic</option>
              <option value="funny">😂 Funny</option>
              <option value="modern">🌟 Modern</option>
            </select>
          </div>

          <button type="submit" class="btn btn-danger w-100">💌 Generate Card</button>
        </form>
      </div>

      <!-- Card Preview Section -->
      <div class="col-md-6">
        <h4 class="text-center text-light mb-4 fw-bold">🎁 Raksha Bandhan Greeting Card</h4>

        <div class="card-container shadow rounded-4 p-4 bg-dark position-relative overflow-hidden">
          <!-- Left Decorative Border -->
          <div class="border left">
            <div class="swirl"></div>
            <div class="circle-deco"></div>
            <div class="swirl"></div>
          </div>

          <!-- Preview Content -->
          <div class="card-preview text-center p-4 rakhi-theme">
            <div class="ribbon">🌸 शुभ रक्षाबंधन</div>
            <h5 id="preview-to" class="fw-bold fs-3 text-light"></h5>
            <p id="preview-message" class="fs-5 text-white-50 fst-italic"></p>
            <h6 id="preview-from" class="mt-3 text-light"></h6>
          </div>

          <!-- Right Decorative Border -->
          <div class="border right">
            <div class="swirl"></div>
            <div class="circle-deco"></div>
            <div class="swirl"></div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-between mt-4">
          <button id="download-btn" class="btn btn-success rounded-pill px-4 shadow-sm">
            <i class="fas fa-download me-2"></i>Download
          </button>
          <button id="share-btn" class="btn btn-primary rounded-pill px-4 shadow-sm">
            <i class="fas fa-share-alt me-2"></i>Share
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer Include -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/card-generator.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
